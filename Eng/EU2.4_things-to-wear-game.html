<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Things to Wear Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mali:wght@400;600;700&display=swap">
<style>
/* Layout: one centered column — washing-line header, sticker-card mode menu, then one play card per question */
:root{
  --sky:#DCEFF7; --paper:#FFFFFF; --tint:#F0F8FB; --line:#B7D5E3;
  --ink:#1F3350; --ink-soft:#57708E;
  --sun:#FF8A2A; --sun-deep:#D9650A; --teal:#1E8A92;
  --good:#2C9A52; --good-bg:#E2F5E8; --bad:#D4433A; --bad-bg:#FCE7E5; --star:#F7B500;
  --f-display:"Fredoka","Mali",ui-rounded,system-ui,sans-serif;
  --f-body:"Mali","Fredoka",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--sky);color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
svg{display:block}

.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.unit{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;background:var(--sun);color:#fff;border-radius:999px;padding:2px 12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:6px 0 2px;color:var(--ink);text-wrap:balance}
h1 span{color:var(--sun-deep)}
.sub{margin:0;color:var(--ink-soft)}

.line{width:100%;height:auto;margin:6px 0 4px;overflow:visible}
.line .hang{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
.line .hang:nth-child(even){animation-delay:-1.6s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.mode:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.mode-ic{flex:0 0 72px;height:72px;background:var(--tint);border-radius:16px;padding:8px}
.mode-tx{display:flex;flex-direction:column;min-width:0}
.mode-en{font-family:var(--f-display);font-weight:600;font-size:1.25rem;line-height:1.2}
.mode-th{color:var(--ink-soft);font-size:.95rem}
.stars{letter-spacing:2px;color:var(--line);font-size:1.05rem}
.stars b{color:var(--star);font-weight:400}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:600}
.bar-title{font-family:var(--f-display);font-weight:600;font-size:1.3rem;flex:1 1 auto;min-width:0}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.dots i.done{background:var(--teal);border-color:var(--teal)}
.dots i.now{border-color:var(--sun);background:var(--sun)}
.score{font-family:var(--f-display);font-weight:600;font-size:1.2rem;color:var(--ink)}
.score::before{content:"★ ";color:var(--star)}

.stage{background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;padding:20px;box-shadow:0 6px 0 var(--ink)}
.prompt{margin:0 0 12px;font-weight:600;font-size:1.1rem;text-align:center}
.speak{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:8px 18px;font-weight:600;font-size:1rem}
.speak svg{width:22px;height:22px}
.speak.sm{padding:4px 10px;font-size:.9rem}
.speak.sm svg{width:18px;height:18px}
.center{display:flex;justify-content:center;margin-bottom:14px}

.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:560px){.pics{grid-template-columns:repeat(2,1fr)}}
.pic{background:var(--tint);border:2.5px solid var(--line);border-radius:18px;padding:10px;aspect-ratio:1;max-width:100%;transition:transform .1s}
.pic:hover:not(:disabled){transform:scale(1.03);border-color:var(--teal)}
.pic svg{width:100%;height:100%}

.right{border-color:var(--good)!important;background:var(--good-bg)!important}
.wrong{border-color:var(--bad)!important;background:var(--bad-bg)!important;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
button:disabled{cursor:default}

.scene{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:20px;align-items:center}
@media (max-width:600px){.scene{grid-template-columns:1fr}.scene .doll{max-width:180px;margin:0 auto}}
.doll{background:radial-gradient(circle at 50% 60%,var(--tint) 0 60%,transparent 61%);border-radius:20px}
.doll svg{width:100%;height:auto}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.q{font-family:var(--f-display);font-weight:600;font-size:1.5rem;margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sent{display:block;width:100%;text-align:left;background:var(--tint);border:2.5px solid var(--line);border-radius:16px;padding:12px 16px;font-family:var(--f-display);font-size:1.15rem;font-weight:500}
.sent:hover:not(:disabled){border-color:var(--teal)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn .sent{text-align:center;font-size:1.3rem}

.match{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.match{grid-template-columns:1fr}}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.word{background:var(--tint);border:2.5px solid var(--line);border-radius:16px;font-family:var(--f-display);font-weight:600;font-size:1.2rem;min-height:64px}
.sel{border-color:var(--sun)!important;background:#FFF1E4!important;transform:scale(1.04)}
.done{opacity:.35;border-color:var(--good)!important;background:var(--good-bg)!important}

.spell{display:flex;flex-direction:column;align-items:center;gap:14px}
.spell .big{width:150px;height:150px;background:var(--tint);border-radius:22px;padding:12px}
.slots,.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot,.tile{width:48px;height:56px;border-radius:12px;font-family:var(--f-display);font-weight:600;font-size:1.6rem;display:grid;place-items:center}
.slot{background:var(--paper);border:2.5px dashed var(--line)}
.slot.fill{border-style:solid;border-color:var(--ink)}
.slot.fixed{border:0;width:20px}
.tile{background:var(--sun);color:#fff;border:0;box-shadow:0 4px 0 var(--sun-deep)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-deep)}
.tile.used{visibility:hidden}
.slots.ok .slot{border-color:var(--good);background:var(--good-bg)}
.slots.bad{animation:shake .35s}

.fb{min-height:52px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center;font-weight:600;font-size:1.1rem}
.fb .good{color:var(--good)}
.fb .bad{color:var(--bad)}
.btn{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:8px 20px;font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 var(--ink)}
.btn.primary{background:var(--sun);color:#fff;border-color:var(--sun-deep);box-shadow:0 4px 0 var(--sun-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.vsec{margin-bottom:22px}
.vsec h3{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.vsec h3 small{font-family:var(--f-body);font-weight:400;color:var(--ink-soft);font-size:.9rem}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.vcard{background:var(--tint);border:2.5px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.vcard:hover{border-color:var(--teal)}
.vcard svg{width:84px;height:84px}
.v-en{font-family:var(--f-display);font-weight:600;font-size:1.2rem}
.v-th{font-size:.85rem;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--f-display);font-weight:500}
.chip i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink)}
.chip small{font-family:var(--f-body);color:var(--ink-soft)}
.phr{display:grid;gap:8px}
.phr button{text-align:left;background:var(--tint);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-family:var(--f-display);font-size:1.1rem;display:flex;justify-content:space-between;gap:10px;align-items:center}
.phr small{font-family:var(--f-body);color:var(--ink-soft);font-size:.85rem}

.end{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center}
@media (max-width:600px){.end{grid-template-columns:1fr;text-align:center}.end .doll{max-width:170px;margin:0 auto}}
.end h2{font-family:var(--f-display);font-size:2.2rem;margin:0}
.bigstars{font-size:3rem;letter-spacing:6px;color:var(--line)}
.bigstars b{color:var(--star);font-weight:400}
.row{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:600px){.row{justify-content:center}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="hd">
    <div>
      <span class="unit">Unit 4 · Clothes</span>
      <h1>Things to <span>Wear</span></h1>
      <p class="sub">เกมภาษาอังกฤษ เรื่องเครื่องแต่งกาย · Lesson 1, 2, 4</p>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
const ITEMS={
  shirt:{en:'shirt',th:'เสื้อเชิ้ต',pl:0,slot:'top',l:1},
  dress:{en:'dress',th:'ชุดกระโปรง',pl:0,slot:'top',l:1},
  skirt:{en:'skirt',th:'กระโปรง',pl:0,slot:'bottom',l:1},
  pants:{en:'pants',th:'กางเกงขายาว',pl:1,slot:'bottom',l:1},
  socks:{en:'socks',th:'ถุงเท้า',pl:1,slot:'socks',l:1},
  shoes:{en:'shoes',th:'รองเท้า',pl:1,slot:'feet',l:1},
  cap:{en:'cap',th:'หมวกแก๊ป',pl:0,slot:'head',l:2},
  tshirt:{en:'T-shirt',th:'เสื้อยืด',pl:0,slot:'top',l:2},
  shorts:{en:'shorts',th:'กางเกงขาสั้น',pl:1,slot:'bottom',l:2},
  sneakers:{en:'sneakers',th:'รองเท้าผ้าใบ',pl:1,slot:'feet',l:2},
  hat:{en:'hat',th:'หมวกไหมพรม',pl:0,slot:'head',l:4},
  coat:{en:'coat',th:'เสื้อโค้ท',pl:0,slot:'top',l:4},
  sweater:{en:'sweater',th:'เสื้อสเวตเตอร์',pl:0,slot:'top',l:4},
  boots:{en:'boots',th:'รองเท้าบูท',pl:1,slot:'feet',l:4},
};
const COLORS={red:'#E5463B',blue:'#2F6FD6',green:'#3AA655',yellow:'#F6C915',orange:'#F68A1E',pink:'#F27BB0',purple:'#8A57C9',black:'#2E2E36',white:'#F8F8F3',gray:'#959CA6',brown:'#9A6233'};
const CTH={red:'แดง',blue:'น้ำเงิน',green:'เขียว',yellow:'เหลือง',orange:'ส้ม',pink:'ชมพู',purple:'ม่วง',black:'ดำ',white:'ขาว',gray:'เทา',brown:'น้ำตาล'};
const VCOL={shirt:'green',dress:'blue',skirt:'red',pants:'brown',socks:'yellow',shoes:'black',cap:'blue',tshirt:'green',shorts:'orange',sneakers:'pink',hat:'blue',coat:'green',sweater:'purple',boots:'red'};
const KEYS=Object.keys(ITEMS), CK=Object.keys(COLORS);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const art=k=>ITEMS[k].pl?'':'a ';
// "an orange shirt", "red boots", "a cap"
const phr=o=>o.c?(ITEMS[o.k].pl?'':(/^[aeiou]/.test(o.c)?'an ':'a '))+o.c+' '+ITEMS[o.k].en:art(o.k)+ITEMS[o.k].en;

function mix(hex,t,to){const n=parseInt(hex.slice(1),16);const c=[n>>16,n>>8&255,n&255].map((v,i)=>Math.round(v+(to[i]-v)*t));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
const dk=c=>mix(c,.45,[25,25,45]), lt=c=>mix(c,.5,[255,255,255]);

/* ---------- clothing icons (100×100) ---------- */
function icon(k,c){
  const C=COLORS[c]||c,D=dk(C),L=lt(C);
  const s=`stroke="${D}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  const longTop='M32 14 L42 10 Q50 18 58 10 L68 14 L84 26 L92 80 L80 82 L72 42 L72 92 L28 92 L28 42 L20 82 L8 80 L16 26 Z';
  const shoe='M6 58 Q6 38 22 38 L36 38 Q40 50 58 53 L66 56 Q72 62 68 70 L8 70 Q5 66 6 58 Z';
  const boot='M14 8 L38 8 L38 52 Q60 54 66 64 L66 76 L12 76 L12 52 Z';
  const sock='M28 10 L44 10 L44 58 L58 66 Q66 72 60 82 L30 82 Q22 80 26 66 Z';
  let b='';
  switch(k){
    case'tshirt':b=`<path ${s} fill="${C}" d="M32 16 L42 12 Q50 22 58 12 L68 16 L88 32 L78 46 L70 40 L70 88 L30 88 L30 40 L22 46 L12 32 Z"/><path ${s} fill="none" d="M42 12 Q50 26 58 12"/>`;break;
    case'shirt':b=`<path ${s} fill="${C}" d="M32 14 L42 10 L50 18 L58 10 L68 14 L84 26 L92 80 L80 82 L72 42 L72 92 L28 92 L28 42 L20 82 L8 80 L16 26 Z"/><path ${s} fill="${L}" d="M42 10 L50 18 L44 28 L38 14 Z M58 10 L50 18 L56 28 L62 14 Z"/><path ${s} d="M50 22 L50 92"/>${[36,50,64,78].map(y=>`<circle cx="54" cy="${y}" r="2.4" fill="${D}"/>`).join('')}`;break;
    case'sweater':b=`<path ${s} fill="${C}" d="${longTop}"/><path fill="${L}" d="M29 44 H71 V52 H29 Z M29 62 H71 V70 H29 Z"/><path ${s} fill="${L}" d="M28 84 H72 V92 H28 Z M8 80 L20 82 L19 74 L9 72 Z M92 80 L80 82 L81 74 L91 72 Z"/><path ${s} fill="none" d="M42 10 Q50 20 58 10"/>`;break;
    case'coat':b=`<path ${s} fill="${C}" d="M30 12 L42 8 L50 16 L58 8 L70 12 L86 24 L94 84 L82 86 L74 42 L76 96 L24 96 L26 42 L18 86 L6 84 L14 24 Z"/><path ${s} d="M50 16 L50 96"/><path ${s} fill="${L}" d="M42 8 L50 16 L42 30 L34 12 Z M58 8 L50 16 L58 30 L66 12 Z M30 64 H42 V74 H30 Z M58 64 H70 V74 H58 Z"/>`;break;
    case'dress':b=`<path ${s} fill="${C}" d="M38 8 L44 8 Q50 18 56 8 L62 8 L64 34 L72 46 L90 92 L10 92 L28 46 L36 34 Z"/><path ${s} fill="${L}" d="M33 38 H67 V46 H33 Z"/><path ${s} fill="none" d="M24 72 Q37 78 50 72 Q63 78 76 72"/>`;break;
    case'skirt':b=`<path ${s} fill="${C}" d="M30 28 L70 28 L88 84 L12 84 Z"/><path ${s} fill="${L}" d="M28 18 H72 V28 H28 Z"/><path ${s} d="M40 28 L32 84 M50 28 L50 84 M60 28 L68 84"/>`;break;
    case'pants':b=`<path ${s} fill="${C}" d="M28 8 L72 8 L78 92 L56 92 L50 34 L44 92 L22 92 Z"/><path ${s} d="M28 18 H72 M50 18 V30"/>`;break;
    case'shorts':b=`<path ${s} fill="${C}" d="M22 24 L78 24 L84 72 L56 74 L50 46 L44 74 L16 72 Z"/><path ${s} d="M22 33 H78 M50 33 V44"/>`;break;
    case'socks':b=[[26,6],[-8,0]].map(([x,y])=>`<g transform="translate(${x} ${y})"><path ${s} fill="${C}" d="${sock}"/><path ${s} fill="${L}" d="M28 10 H44 V22 H28 Z"/></g>`).join('');break;
    case'shoes':b=[[26,16],[0,-6]].map(([x,y])=>`<g transform="translate(${x} ${y})"><path ${s} fill="${C}" d="${shoe}"/><path ${s} fill="${D}" d="M6 66 H70 L68 72 H8 Z"/></g>`).join('');break;
    case'sneakers':b=[[26,14],[0,-8]].map(([x,y])=>`<g transform="translate(${x} ${y})"><path ${s} fill="${C}" d="${shoe}"/><path ${s} fill="#FFFFFF" d="M5 64 L70 64 Q73 72 66 76 L9 76 Q4 72 5 64 Z"/><path ${s} fill="none" d="M26 42 L32 48 M31 40 L37 47 M36 39 L42 48"/><path stroke="${L}" stroke-width="4" stroke-linecap="round" fill="none" d="M14 56 Q32 50 52 58"/></g>`).join('');break;
    case'boots':b=[[26,10],[0,0]].map(([x,y])=>`<g transform="translate(${x} ${y})"><path ${s} fill="${C}" d="${boot}"/><path ${s} fill="${L}" d="M14 8 H38 V18 H14 Z"/><path ${s} fill="${D}" d="M12 70 H66 V76 H12 Z"/></g>`).join('');break;
    case'cap':b=`<path ${s} fill="${C}" d="M10 66 Q10 24 44 24 Q76 24 78 62 L78 66 Z"/><path ${s} fill="${L}" d="M62 60 Q90 56 96 64 Q94 74 80 72 L58 70 Z"/><path ${s} fill="none" d="M44 26 Q36 44 34 66"/><circle ${s} cx="44" cy="24" r="4" fill="${D}"/>`;break;
    case'hat':b=`<path ${s} fill="${C}" d="M18 74 Q16 30 50 28 Q84 30 82 74 Z"/><rect ${s} x="14" y="62" width="72" height="20" rx="7" fill="${L}"/><path ${s} d="M26 64 V80 M38 64 V80 M50 64 V80 M62 64 V80 M74 64 V80"/><circle ${s} cx="50" cy="22" r="10" fill="${L}"/>`;break;
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${b}</svg>`;
}

/* ---------- paper-doll character (200×320) ---------- */
const SKINS=['#F6D3B3','#E8B48C','#C08458','#8E5D3E'], HAIRS=['#3B2A20','#1E1A18','#7A4A24','#C9963A'];
function randOutfit(){
  const g=pick(['boy','girl']);
  const top={k:pick(g==='girl'?['shirt','tshirt','sweater','coat','dress']:['shirt','tshirt','sweater','coat']),c:pick(CK)};
  let bottom=null;
  if(top.k!=='dress')bottom={k:pick(g==='girl'?['pants','shorts','skirt']:['pants','shorts']),c:pick(CK.filter(c=>c!==top.c))};
  const feet={k:pick(['shoes','sneakers','boots']),c:pick(CK)};
  const socks=feet.k!=='boots'&&Math.random()<.5?{k:'socks',c:pick(CK.filter(c=>c!==feet.c))}:null;
  const head=Math.random()<.5?{k:pick(['cap','hat']),c:pick(CK)}:null;
  return{g,skin:pick(SKINS),hair:pick(HAIRS),top,bottom,feet,socks,head};
}
const wornList=o=>[o.top,o.bottom,o.feet,o.socks,o.head].filter(Boolean);

function doll(o){
  const sk=o.skin,Sk=dk(sk);
  const st=c=>`fill="${COLORS[c]}" stroke="${dk(COLORS[c])}" stroke-width="2.5" stroke-linejoin="round"`;
  const lf=c=>`fill="${lt(COLORS[c])}" stroke="${dk(COLORS[c])}" stroke-width="2" stroke-linejoin="round"`;
  const skin=`fill="${sk}" stroke="${Sk}" stroke-width="2"`;
  let p='';
  if(o.g==='girl')p+=`<path fill="${o.hair}" d="M62 60 Q60 20 100 20 Q140 20 138 60 L142 124 Q120 134 100 130 Q80 134 58 124 Z"/>`;
  p+=`<rect ${skin} x="74" y="176" width="22" height="120" rx="9"/><rect ${skin} x="104" y="176" width="22" height="120" rx="9"/>`;
  p+=`<rect ${skin} x="50" y="104" width="16" height="84" rx="8"/><rect ${skin} x="134" y="104" width="16" height="84" rx="8"/>`;
  p+=`<rect ${skin} x="92" y="82" width="16" height="22"/>`;
  if(o.socks)p+=`<rect ${st(o.socks.c)} x="73" y="262" width="24" height="32" rx="4"/><rect ${st(o.socks.c)} x="103" y="262" width="24" height="32" rx="4"/>`;
  const f=o.feet;
  if(f.k==='boots')p+=[72,102].map(x=>`<rect ${st(f.c)} x="${x}" y="240" width="26" height="66" rx="7"/><rect ${lf(f.c)} x="${x}" y="240" width="26" height="12" rx="4"/>`).join('');

  if(t.k==='shirt')p+=longSl+`<path ${T} d="M68 100 L132 100 L132 188 L68 188 Z"/><path fill="${sk}" d="M90 100 L100 114 L110 100 Z"/><path ${Tl} d="M88 98 L100 112 L92 120 L84 102 Z M112 98 L100 112 L108 120 L116 102 Z"/><path stroke="${dk(COLORS[t.c])}" stroke-width="2" d="M100 114 V188"/>${[130,150,170].map(y=>`<circle cx="104" cy="${y}" r="2.5" fill="${dk(COLORS[t.c])}"/>`).join('')}`;
  if(t.k==='sweater')p+=longSl+`<path ${T} d="M68 100 L132 100 L132 190 L68 190 Z"/><path fill="${lt(COLORS[t.c])}" d="M69.5 124 H130.5 V132 H69.5 Z M69.5 148 H130.5 V156 H69.5 Z"/><path ${Tl} d="M68 180 H132 V190 H68 Z M46 176 H68 V184 H46 Z M132 176 H154 V184 H132 Z"/>`+neck;

/* ---------- sound ---------- */
let voice=null;
function loadVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Ava/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{loadVoice();speechSynthesis.onvoiceschanged=loadVoice}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
let ac=null;
function tone(fs,type,dur){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;fs.forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.03);t+=dur*.85})}catch(e){}}
const ding=()=>tone([660,880],'triangle',.12), buzz=()=>tone([220,160],'square',.13), fanfare=()=>tone([523,659,784,1047],'triangle',.16);
const SPK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;

const store={get(k){try{return JSON.parse(localStorage.getItem('ttw:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('ttw:'+k,JSON.stringify(v))}catch(e){}}};
const stars=n=>`<span class="stars">${[1,2,3].map(i=>i<=n?'<b>★</b>':'★').join('')}</span>`;

/* ---------- menu ---------- */
const MODES=[
  {id:'vocab',en:'Word Closet',th:'ทบทวนคำศัพท์ แตะการ์ดเพื่อฟังเสียง',ic:['tshirt','orange']},
  {id:'match',en:'Match It!',th:'จับคู่ภาพกับคำศัพท์',ic:['socks','purple']},
  {id:'listen',en:'Listen & Tap',th:'ฟังเสียง แล้วแตะภาพที่ถูกต้อง',ic:['sneakers','red']},
  {id:'look',en:"What's she wearing?",th:'ดูภาพ แล้วเลือกประโยคที่ถูกต้อง',ic:['dress','blue']},
  {id:'yesno',en:'Is he wearing a hat?',th:'ดูภาพ แล้วตอบ Yes หรือ No',ic:['hat','green']},
  {id:'spell',en:'Spell It',th:'เรียงตัวอักษรให้เป็นคำศัพท์',ic:['cap','yellow']},
];
const app=$('#app');
let G=null;

function clothesline(){
  const hang=['shirt','dress','socks','pants','cap','sweater','shorts'], cols=['green','blue','yellow','brown','red','purple','orange'];
  const y=t=>(1-t)*(1-t)*14+2*(1-t)*t*62+t*t*14;
  let g='';
  hang.forEach((k,i)=>{const t=(i+.5)/hang.length,x=900*t,yy=y(t);
    g+=`<g class="hang"><rect x="${x-5}" y="${yy-8}" width="10" height="18" rx="2" fill="#C99A5B" stroke="#8A6534" stroke-width="1.5"/><svg x="${x-45}" y="${yy+2}" width="90" height="90" viewBox="0 0 100 100">${icon(k,cols[i]).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg></g>`});
  return `<svg class="line" viewBox="0 0 900 160" aria-hidden="true"><path d="M0 14 Q450 110 900 14" fill="none" stroke="#7D97AA" stroke-width="2.5"/>${g}</svg>`;
}
function home(){
  G=null;try{speechSynthesis.cancel()}catch(e){}
  app.innerHTML=clothesline()+`<section class="menu">${MODES.map(m=>`<button class="mode" data-m="${m.id}"><span class="mode-ic">${icon(...m.ic)}</span><span class="mode-tx"><span class="mode-en">${m.en}</span><span class="mode-th">${m.th}</span>${m.id==='vocab'?'':stars(store.get(m.id)||0)}</span></button>`).join('')}</section>`;
  $$('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
}

/* ---------- game engine ---------- */
function start(id){
  const m=MODES.find(x=>x.id===id);
  if(id==='vocab')return vocab(m);
  G={m,i:0,n:id==='match'?6:8,score:0,list:shuffle(KEYS)};
  app.innerHTML=`<div class="bar"><button class="back" id="back">← เมนู</button><div class="bar-title">${m.en}</div><div class="dots" id="dots"></div><div class="score" id="sc">0</div></div><div class="stage" id="stage"></div><div class="fb" id="fb" aria-live="polite"></div>`;
  $('#back').onclick=home;
  window.scrollTo(0,0);
  if(id==='match')return match();
  next();
}
function dots(){$('#dots').innerHTML=Array.from({length:G.n},(_,i)=>`<i class="${i<G.i?'done':i===G.i?'now':''}"></i>`).join('');$('#sc').textContent=G.score}
function stage(h){$('#stage').innerHTML=h}
function fb(h){$('#fb').innerHTML=h}
function next(){if(G.i>=G.n)return finish();G.locked=false;dots();fb('');RENDER[G.m.id]()}
function advance(){const g=G;return()=>{if(G===g){G.i++;next()}}}
function result(ok,answer){
  if(ok){G.score++;$('#sc').textContent=G.score;ding();fb(`<span class="good">${pick(['เก่งมาก!','ถูกต้อง!','เยี่ยมเลย!'])} ${pick(['Great job!','Well done!','Super!'])}</span>`);setTimeout(advance(),1300)}
  else{buzz();fb(`<span class="bad">ยังไม่ถูกนะ คำตอบคือ “${answer}”</span><button class="btn primary" id="nx">ข้อต่อไป ▶</button>`);$('#nx').onclick=advance();$('#nx').focus({preventScroll:true})}
}
function choose(sel,isRight,onPick){
  const bs=$$(sel);
  bs.forEach(b=>b.onclick=()=>{if(G.locked)return;G.locked=true;const ok=isRight(b);bs.forEach(x=>{x.disabled=true;if(isRight(x))x.classList.add('right')});if(!ok)b.classList.add('wrong');onPick(ok)});
}
const speakBtn=(id,label,cls='')=>`<button class="speak ${cls}" id="${id}">${SPK}${label}</button>`;

const RENDER={
  listen(){
    const withC=Math.random()<.5,t={k:pick(KEYS),c:pick(CK)},ch=[t],used=new Set([t.k]);
    if(withC)ch.push({k:t.k,c:pick(CK.filter(c=>c!==t.c))});
    while(ch.length<4){const k=pick(KEYS.filter(x=>!used.has(x)));used.add(k);ch.push({k,c:withC&&ch.length===2?t.c:pick(CK)})}
    const words=withC?phr(t):ITEMS[t.k].en,opts=shuffle(ch);
    stage(`<p class="prompt">ฟังแล้วแตะภาพที่ถูกต้อง</p><div class="center">${speakBtn('sp','ฟังอีกครั้ง')}</div><div class="pics">${opts.map((o,i)=>`<button class="pic" data-i="${i}" aria-label="choice ${i+1}">${icon(o.k,o.c)}</button>`).join('')}</div>`);
    $('#sp').onclick=()=>say(words);setTimeout(()=>say(words),250);
    choose('.pic',b=>opts[b.dataset.i]===t,ok=>result(ok,words));
  },
  look(){
    const o=randOutfit(),he=o.g==='boy',P=he?"He's":"She's",Q=he?"What's he wearing?":"What's she wearing?";
    const a=o.top,b=o.bottom||o.feet,sent=(x,y)=>`${P} wearing ${phr(x)} and ${phr(y)}.`,right=sent(a,b);
    const set=new Set([right]);let guard=0;
    while(set.size<3&&guard++<60){
      const x={...a},y={...b},r=Math.random();
      if(r<.35)x.c=pick(CK.filter(c=>c!==a.c));
      else if(r<.65)y.c=pick(CK.filter(c=>c!==b.c));
      else{const alt=KEYS.filter(k=>ITEMS[k].slot===ITEMS[r<.85?b.k:a.k].slot&&k!==b.k&&k!==a.k&&!(he&&(k==='dress'||k==='skirt')));
        if(!alt.length)continue;if(r<.85)y.k=pick(alt);else{x.k=pick(alt);if(x.k==='dress')continue}}
      set.add(sent(x,y));
    }
    const opts=shuffle([...set]);
    stage(`<div class="scene"><div class="doll">${doll(o)}</div><div class="side"><p class="q">${Q} ${speakBtn('sp','','sm')}</p>${opts.map((s,i)=>`<button class="sent" data-i="${i}">${s}</button>`).join('')}</div></div>`);
    $('#sp').onclick=()=>say(Q);setTimeout(()=>say(Q),250);
    choose('.sent',x=>opts[x.dataset.i]===right,ok=>{say(right);result(ok,right)});
  },
  yesno(){
    const o=randOutfit(),he=o.g==='boy',pr=he?'he':'she',worn=wornList(o),r=Math.random();let q,yes;
    if(r<.45){const w=pick(worn);q={k:w.k,c:Math.random()<.5?w.c:null};yes=true}
    else if(r<.7){const w=pick(worn);q={k:w.k,c:pick(CK.filter(c=>c!==w.c))};yes=false}
    else{q={k:pick(KEYS.filter(k=>!worn.some(w=>w.k===k)&&!(he&&(k==='dress'||k==='skirt')))),c:Math.random()<.4?pick(CK):null};yes=false}
    const Q=`Is ${pr} wearing ${phr(q)}?`,ans=[`Yes, ${pr} is.`,`No, ${pr} isn't.`],right=yes?ans[0]:ans[1];
    stage(`<div class="scene"><div class="doll">${doll(o)}</div><div class="side"><p class="q">${Q} ${speakBtn('sp','','sm')}</p><div class="yn">${ans.map((s,i)=>`<button class="sent" data-i="${i}">${s}</button>`).join('')}</div></div></div>`);
    $('#sp').onclick=()=>say(Q);setTimeout(()=>say(Q),250);
    choose('.sent',x=>ans[x.dataset.i]===right,ok=>{say(right);result(ok,right)});
  },
  spell(){
    const k=G.list[G.i],w=ITEMS[k].en,lw=w.toLowerCase();
    const letters=[...lw].map((ch,i)=>({ch,i})).filter(x=>x.ch!=='-');
    let tiles;do{tiles=shuffle(letters.map((x,j)=>({ch:x.ch,id:j})))}while(tiles.length>2&&tiles.map(t=>t.ch).join('')===letters.map(t=>t.ch).join(''));
    const slots=[...lw].map(ch=>ch==='-'?{fixed:'-'}:{t:null});let miss=0;
    stage(`<div class="spell"><div class="big">${icon(k,pick(CK.filter(c=>c!=='white')))}</div>${speakBtn('sp','ฟังเสียง')}<div class="slots" id="slots"></div><div class="tiles" id="tiles"></div><button class="btn" id="clr">ล้างคำตอบ</button></div>`);
    const draw=()=>{
      $('#slots').innerHTML=slots.map((s,i)=>s.fixed?`<span class="slot fixed">-</span>`:`<button class="slot ${s.t?'fill':''}" data-i="${i}" aria-label="slot ${i+1}">${s.t?s.t.ch:''}</button>`).join('');
      $('#tiles').innerHTML=tiles.map(t=>`<button class="tile ${slots.some(s=>s.t===t)?'used':''}" data-id="${t.id}">${t.ch}</button>`).join('');
      $$('#tiles .tile').forEach(b=>b.onclick=()=>{if(G.locked)return;const t=tiles.find(x=>x.id==b.dataset.id);const s=slots.find(s=>!s.fixed&&!s.t);if(!s)return;s.t=t;draw();check()});
      $$('#slots .slot[data-i]').forEach(b=>b.onclick=()=>{if(G.locked)return;slots[b.dataset.i].t=null;draw()});
    };
    const check=()=>{
      if(slots.some(s=>!s.fixed&&!s.t))return;
      const got=slots.map(s=>s.fixed||s.t.ch).join('');
      if(got===lw){G.locked=true;$('#slots').classList.add('ok');say(w);
        if(!miss)return result(true,w);
        ding();fb(`<span class="good">ถูกแล้ว! “${w}”</span>`);setTimeout(advance(),1300);}
      else{miss++;const el=$('#slots');el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');
        if(miss>=2){G.locked=true;slots.forEach((s,i)=>{if(!s.fixed)s.t={ch:lw[i]}});draw();say(w);result(false,w)}
        else{buzz();fb(`<span class="bad">ลองอีกครั้งนะ</span>`);setTimeout(()=>{if(!G.locked){slots.forEach(s=>{if(!s.fixed)s.t=null});draw()}},500)}}
    };
    $('#sp').onclick=()=>say(w);$('#clr').onclick=()=>{if(G.locked)return;slots.forEach(s=>{if(!s.fixed)s.t=null});draw()};
    draw();setTimeout(()=>say(w),250);
  },
};

function match(){
  dots();
  const ks=G.list.slice(0,6),cols={};ks.forEach(k=>cols[k]=pick(CK.filter(c=>c!=='white')));
  stage(`<p class="prompt">แตะภาพ แล้วแตะคำที่ตรงกัน</p><div class="match"><div class="mgrid">${shuffle(ks).map(k=>`<button class="pic mi" data-k="${k}" data-s="L" aria-label="picture">${icon(k,cols[k])}</button>`).join('')}</div><div class="mgrid">${shuffle(ks).map(k=>`<button class="word mi" data-k="${k}" data-s="R">${ITEMS[k].en}</button>`).join('')}</div></div>`);
  let sel=null;const missed=new Set(),g=G;
  $$('.mi').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('done'))return;
    if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');if(b.dataset.s==='R')say(ITEMS[b.dataset.k].en);return}
    const a=sel;sel=null;a.classList.remove('sel');
    if(a.dataset.k===b.dataset.k){
      [a,b].forEach(x=>{x.classList.add('done');x.disabled=true});say(ITEMS[b.dataset.k].en);ding();
      if(!missed.has(b.dataset.k))G.score++;G.i++;dots();
      fb(`<span class="good">${ITEMS[b.dataset.k].en} = ${ITEMS[b.dataset.k].th}</span>`);
      if(G.i===G.n)setTimeout(()=>{if(G===g)finish()},1100);
    }else{
      missed.add(a.dataset.k);missed.add(b.dataset.k);buzz();
      [a,b].forEach(x=>{x.classList.remove('wrong');void x.offsetWidth;x.classList.add('wrong');setTimeout(()=>x.classList.remove('wrong'),450)});
      fb(`<span class="bad">ยังไม่ตรงกัน ลองใหม่นะ</span>`);
    }
  });
}

function finish(){
  const r=G.score/G.n,s=r>=.99?3:r>=.7?2:1,m=G.m;
  if(s>(store.get(m.id)||0))store.set(m.id,s);
  fanfare();
  app.innerHTML=`<div class="stage end"><div class="doll">${doll(randOutfit())}</div><div><h2>${['','Good try!','Well done!','Super star!'][s]}</h2><div class="bigstars">${[1,2,3].map(i=>i<=s?'<b>★</b>':'★').join('')}</div><p>${m.en} · ได้ ${G.score} จาก ${G.n} คะแนน</p><div class="row"><button class="btn primary" id="again">เล่นอีกครั้ง</button><button class="btn" id="menu">กลับเมนู</button></div></div></div>`;
  $('#again').onclick=()=>start(m.id);$('#menu').onclick=home;
}

function vocab(m){
  G=null;
  const sec=(l,title)=>`<section class="vsec"><h3>Lesson ${l} <small>${title}</small></h3><div class="vgrid">${KEYS.filter(k=>ITEMS[k].l===l).map(k=>`<button class="vcard" data-k="${k}">${icon(k,VCOL[k])}<span class="v-en">${ITEMS[k].en}</span><span class="v-th">${ITEMS[k].th}</span></button>`).join('')}</div></section>`;
  const P=[["What's he wearing?","เขาใส่อะไรอยู่"],["He's wearing a blue shirt and gray pants.","เขาใส่เสื้อเชิ้ตสีน้ำเงินและกางเกงสีเทา"],["What are you wearing?","คุณใส่อะไรอยู่"],["I'm wearing a yellow shirt and white shorts.","ฉันใส่เสื้อเชิ้ตสีเหลืองและกางเกงขาสั้นสีขาว"],["We're wearing red caps.","พวกเราใส่หมวกแก๊ปสีแดง"],["Is she wearing a hat?","เธอใส่หมวกไหม"],["Yes, she is.","ใช่ เธอใส่"],["No, she isn't.","ไม่ เธอไม่ได้ใส่"]];
  app.innerHTML=`<div class="bar"><button class="back" id="back">← เมนู</button><div class="bar-title">${m.en}</div></div><div class="stage">
    <p class="prompt">แตะการ์ดเพื่อฟังเสียง</p>
    ${sec(1,'shirt · dress · skirt · pants · socks · shoes')}${sec(2,'cap · T-shirt · shorts · sneakers')}${sec(4,'hat · coat · sweater · boots')}
    <section class="vsec"><h3>Colors <small>สี</small></h3><div class="chips">${CK.map(c=>`<button class="chip" data-c="${c}"><i style="background:${COLORS[c]}"></i>${c}<small>${CTH[c]}</small></button>`).join('')}</div></section>
    <section class="vsec"><h3>Sentences <small>ประโยค</small></h3><div class="phr">${P.map(([e,t],i)=>`<button data-i="${i}"><span>${e}<br><small>${t}</small></span>${SPK.replace('<svg','<svg width="22" height="22"')}</button>`).join('')}</div></section>
  </div>`;
  $('#back').onclick=home;window.scrollTo(0,0);
